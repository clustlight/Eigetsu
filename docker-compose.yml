services:
  web:
    image: ghcr.io/clustlight/eigetsu-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/clustlight/eigetsu-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      SFU_URL: http://sfu:3000
    expose:
      - '3001'
    depends_on:
      - sfu

  sfu:
    image: ghcr.io/clustlight/eigetsu-sfu:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.sfu
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      ROLE: ${ROLE:-standalone}
      SITE_ID: ${SITE_ID:-local}
      SFU_PUBLIC_URL: ${SFU_PUBLIC_URL:-}
      MASTER_URL: ${MASTER_URL:-}
      CLUSTER_SECRET: ${CLUSTER_SECRET:-}
      MASTER_STATE_FILE: /app/sfu/data/rooms.json
      PIPE_LISTEN_IP: 0.0.0.0
      PIPE_ANNOUNCED_IP: ${PIPE_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_WORKERS: ${MEDIASOUP_WORKERS:-1}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-40100}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
    expose:
      - '3000'
    volumes:
      - sfu_data:/app/sfu/data
    ports:
      - '${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40100}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40100}/udp'
      - '${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40100}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40100}/tcp'

volumes:
  caddy_data:
  caddy_config:
  sfu_data:
